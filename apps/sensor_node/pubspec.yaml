name: sensor_node
description: The sensor node, an Android app that publishes the phone's sensors over zenoh, and in the monitor role a Linux app that shows them with the archive's levels.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  sensor_core: ^1.0.0
  sensors_plus: ^7.1.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  zenoh_dart: ^1.0.0-rc.1

flutter:
  uses-material-design: true
  assets:
    - config/
